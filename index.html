<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine 💘</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #ffb6c1, #ff69b4);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
    }

    h1 {
      color: #ff2d75;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .btns {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font-size: 18px;
      padding: 12px 22px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .yes {
      background: #ff2d75;
      color: white;
    }

    .no {
      background: #eee;
      color: #333;
      position: relative;
    }

    .music {
      background: #ffd1e6;
      color: #000;
      font-size: 14px;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      font-size: 22px;
      animation: float 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes float {
      from {
        transform: translateY(100vh) scale(1);
        opacity: 0;
      }
      10% { opacity: 1; }
      to {
        transform: translateY(-10vh) scale(1.4);
        opacity: 0;
      }
    }

    .result {
      margin-top: 20px;
      font-size: 22px;
      color: #ff2d75;
      font-weight: bold;
      display: none;
    }
  </style>
</head>

<body>

  <!-- 🎵 MUSIQUE ROMANTIQUE -->
  <audio id="music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

  <div class="hearts" id="hearts"></div>

  <div class="card">
    <h1>Will you be my Valentine ? 💘</h1>

    <div class="btns">
      <button class="yes" id="yesBtn">Yes 💖</button>
      <button class="no" id="noBtn">No 🙈</button>
      <button class="music" id="musicBtn">▶ Play music</button>
    </div>
<div class="result" id="result"> 💖</div>

  </div>

 <script>
  const hearts = document.getElementById("hearts");
  const music = document.getElementById("music");

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = Math.random() > 0.5 ? "💖" : "💘";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    hearts.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }

  setInterval(createHeart, 300);

  // YES
  document.getElementById("yesBtn").onclick = () => {
    document.getElementById("result").style.display = "block";
    music.play().catch(err => console.log(err));
    for (let i = 0; i < 30; i++) createHeart();
  };

  // PLAY MUSIC
  document.getElementById("musicBtn").onclick = () => {
    music.play().catch(err => console.log(err));
  };

  // NO button runs away
  const noBtn = document.getElementById("noBtn");
  noBtn.addEventListener("mouseenter", () => {
    noBtn.style.position = "absolute";
    noBtn.style.left = Math.random() * 200 + "px";
    noBtn.style.top = Math.random() * 200 + "px";
  });
</script>
  

</body>
</html>
